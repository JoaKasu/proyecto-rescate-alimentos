<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5 text-center" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="text-danger mb-3">¿Confirmas la eliminación?</h4>
                <p>Vas a dar de baja el producto: <strong>{{ alimento.nombre_producto }}</strong> de {{ alimento.comercio.razon_social }}.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'catalogo' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
