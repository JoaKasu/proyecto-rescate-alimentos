{% if form.non_field_errors %}
<div class="alert alert-danger border-0" role="alert">
    {% for error in form.non_field_errors %}<div><i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}</div>{% endfor %}
</div>
{% endif %}

{% for field in form.visible_fields %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label fw-semibold mb-1">
        {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}
    <div class="text-danger small mt-1"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ error }}</div>
    {% endfor %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
{% endfor %}
