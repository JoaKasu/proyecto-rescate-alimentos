<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Rescate Solidario</span>
            <a href="{% url 'index' %}" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-success">Publicar Donación</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label text-muted">Nombre del alimento</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Categoría</label>
                                <input type="text" name="categoria" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Cantidad (unidades o kg)</label>
                                <input type="number" name="cantidad" class="form-control" min="1" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Fecha Límite</label>
                                <input type="date" name="fecha_limite" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2">Guardar Registro</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
